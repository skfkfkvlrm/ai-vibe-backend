spring.application.name=demo-dog2
server.port=${SERVER_PORT:8083}

# 쿠버네티스 프로브(Liveness / Readiness) 활성화
# /actuator/health/liveness, /actuator/health/readiness, /livez, /readyz
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# 데이터소스 (MySQL) - 환경변수로 덮어쓸 수 있음
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dbdemodog?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:demodog}
spring.datasource.password=${DB_PASSWORD:demo1234}

# JPA 설정 (로컬 개발: update / 운영 환경 권장: validate + 마이그레이션 도구)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
