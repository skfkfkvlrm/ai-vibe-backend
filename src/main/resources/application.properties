spring.application.name=pc-mall

# 헬스 체크 상세 노출 설정 (로컬 개발 모드: always / 운영 환경 권장: when-authorized)
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always

# 헬스 그룹(Health Groups) 분리
# 로드밸런서(LB) 전용: 핵심 ping만 점검하고 상세 내용은 은닉
management.endpoint.health.group.core.include=ping
management.endpoint.health.group.core.show-details=never
management.endpoints.web.base-path=/

# 관제팀/모니터링 전용: 커스텀 지표를 포함한 전수 검사 및 상세 노출
management.endpoint.health.group.ops.include=*
management.endpoint.health.group.ops.show-details=always

# 오류 응답 본문에 message 포함 (개발용: 운영 배포 시 never 또는 on-param 권장)
spring.web.error.include-message=always

# 쿠버네티스 프로브(Liveness / Readiness) 활성화
# /actuator/health/liveness, /actuator/health/readiness, /livez, /readyz
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# 데이터소스 (MySQL) - 환경변수로 덮어쓸 수 있음
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dbdemoboard?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:demoboard}
spring.datasource.password=${DB_PASSWORD}

# JPA 설정 (로컬 개발: update / 운영 환경 권장: validate + 마이그레이션 도구)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true