spring.application.name=pc-mall

# Health check details (local dev: always / production: when-authorized)
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always

# Liveness / Readiness probes: /actuator/health/liveness, /actuator/health/readiness, /livez, /readyz
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# Health groups: core (load balancer, minimal) / ops (monitoring, full)
management.endpoint.health.group.core.include=ping
management.endpoint.health.group.core.show-details=never
management.endpoint.health.group.ops.include=*
management.endpoint.health.group.ops.show-details=always