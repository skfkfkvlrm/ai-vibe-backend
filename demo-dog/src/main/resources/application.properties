spring.application.name=demo-dog

# 1. 헬스 체크 상세 노출 설정 (로컬 개발 모드: always / 운영 환경 권장: when-authorized)
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always

# 2. 쿠버네티스 프로브(Liveness / Readiness) 활성화
# /actuator/health/liveness 및 /actuator/health/readiness 생성
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# 3. 헬스 그룹(Health Groups) 분리
# 로드밸런서(LB) 전용: 핵심 ping만 점검하고 상세 내용은 은닉
management.endpoint.health.group.core.include=ping
management.endpoint.health.group.core.show-details=never

# 관제팀/모니터링 전용: 커스텀 지표를 포함한 전수 검사 및 상세 노출
management.endpoint.health.group.ops.include=*
management.endpoint.health.group.ops.show-details=always

# 4. 데이터소스 (MySQL) - 환경변수로 덮어쓸 수 있음
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dbdemodog?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:demodog}
spring.datasource.password=${DB_PASSWORD:demo1234}

# JPA 설정 (로컬 개발: update / 운영 환경 권장: validate + 마이그레이션 도구)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# 5. 이미지 업로드 / 나무위키 이미지 받아오기 파이프라인
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
app.upload-dir=${UPLOAD_DIR:uploads}
app.ollama.url=${OLLAMA_URL:http://localhost:11434}
app.ollama.model=${OLLAMA_MODEL:qwen2.5-coder:7b}
