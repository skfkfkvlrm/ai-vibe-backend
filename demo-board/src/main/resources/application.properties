spring.application.name=demo-board

# 프로파일을 지정하지 않으면 local(개발)로 실행한다. 운영은 SPRING_PROFILES_ACTIVE=prod.
# DB 접속 정보는 이 파일에 두지 않는다: local은 config/application-local.properties(Git 제외), prod는 환경변수 DB_URL·DB_USERNAME·DB_PASSWORD.
spring.profiles.default=local
server.port=${SERVER_PORT:8084}

# 쿠버네티스 프로브(Liveness / Readiness) 활성화
# /actuator/health/liveness, /actuator/health/readiness, /livez, /readyz
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# 데이터소스 (MySQL) - 환경변수로 덮어쓸 수 있음
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA 설정 (로컬 개발: update / 운영 환경 권장: validate + 마이그레이션 도구)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT: 서명 키는 환경변수 JWT_SECRET(32바이트 이상) 필수. 기본값을 두지 않아 없으면 기동이 실패한다.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
