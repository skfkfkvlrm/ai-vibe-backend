# 운영 프로파일: SPRING_PROFILES_ACTIVE=prod 로 켠다.
# DB 접속 정보(DB_URL, DB_USERNAME, DB_PASSWORD)와 JWT_SECRET은 모두 환경변수로만 받는다(기본값 없음).

# 스키마는 자동으로 바꾸지 않고 엔티티와 일치하는지만 확인한다(다르면 기동 실패).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# 오류 응답에 내부 메시지·스택 트레이스를 싣지 않는다.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# 액추에이터는 health만 노출하고 관리 포트(기본 9090)를 본 서비스 포트와 분리해 이 PC에서만 열어 둔다.
# 서비스 포트에는 /livez, /readyz(상태만 반환)가 계속 열린다.
management.endpoints.web.exposure.include=health
management.server.port=${MANAGEMENT_PORT:9090}
management.server.address=127.0.0.1

# 기본 /actuator/health는 상세 정보를 숨긴다.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# core: 로드밸런서용(핵심 DB만, 상세 비공개), ops: 관제용(전체 구성요소, 상세 공개 — 관리 포트로만 접근)
management.endpoint.health.group.core.include=db
management.endpoint.health.group.core.show-details=never
management.endpoint.health.group.ops.include=*
management.endpoint.health.group.ops.show-details=always
management.endpoint.health.group.ops.show-components=always
