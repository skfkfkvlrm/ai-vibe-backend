spring.application.name=demo-board-test

# 테스트는 MySQL 없이 인메모리 H2(MySQL 호환 모드)로 실행
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# JWT 서명 키(테스트 전용 더미 값, 운영 키 아님)
jwt.secret=test-only-secret-key-for-unit-tests-0123456789
jwt.expiration-minutes=120

# 기존 테스트는 한 테스트에서 같은 IP로 비회원 글을 여러 개 쓰므로 비회원 속도 제한을 끈다(GuestWriteRateLimitTests가 직접 켠다).
board.guest-rate-limit.enabled=false
