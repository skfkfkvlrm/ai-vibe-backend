spring.application.name=demo-boot
server.port=${SERVER_PORT:8081}

# 1. 헬스 체크 상세 노출 설정 (로컬 개발 모드: always / 운영 환경 권장: when-authorized)
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always

# 2. 쿠버네티스 프로브(Liveness / Readiness) 활성화
# /actuator/health/liveness 및 /actuator/health/readiness 생성
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# 3. 헬스 그룹(Health Groups) 분리
# 로드밸런서(LB) 전용: 핵심 ping만 점검하고 상세 내용은 은닉
management.endpoint.health.group.core.include=ping
management.endpoint.health.group.core.show-details=never
management.endpoints.web.base-path=/

# 관제팀/모니터링 전용: 커스텀 지표를 포함한 전수 검사 및 상세 노출
management.endpoint.health.group.ops.include=*
management.endpoint.health.group.ops.show-details=always

# 4. 데이터소스 (MySQL) - 환경변수로 덮어쓸 수 있음
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dbdemoboot?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:demoboot}
spring.datasource.password=${DB_PASSWORD:demo1234}

# 5. JPA 설정 (로컬 개발: update / 운영 환경 권장: validate + 마이그레이션 도구)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
